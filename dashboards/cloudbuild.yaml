# ================================================================
# Cloud Build — Dashboards
# Trigger: cambios en dashboards/**
# Despliega todas las Cloud Functions de dashboards
# ================================================================
steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-campaign-intelligence-api'
    entrypoint: gcloud
    args:
      - functions
      - deploy
      - campaign-intelligence-api
      - --gen2
      - --runtime=python311
      - --region=europe-west1
      - --source=dashboards/campaign-intelligence/api
      - --entry-point=dashboard_api
      - --trigger-http
      - --allow-unauthenticated
      - --memory=512MB
      - --timeout=120s
      - --service-account=dashboards-sa@llyc-ai-first-core.iam.gserviceaccount.com
      - --set-env-vars=GCP_CLIENT_PROJECT=llyc-prj-lcdlc-datamart,BQ_DATASET=ODS,TENANT_ID=lcdc,CLIENT_SECRET_PROJECT=llyc-ai-lcdc

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-sentiment-api'
    entrypoint: gcloud
    args:
      - functions
      - deploy
      - sentiment-api
      - --gen2
      - --runtime=python311
      - --region=europe-west1
      - --source=dashboards/sentiment-intelligence/api
      - --entry-point=sentiment_api
      - --trigger-http
      - --no-allow-unauthenticated
      - --memory=512MB
      - --timeout=120s
      - --service-account=dashboards-sa@llyc-ai-first-core.iam.gserviceaccount.com

includedFiles:
  - 'dashboards/**'

options:
  logging: CLOUD_LOGGING_ONLY