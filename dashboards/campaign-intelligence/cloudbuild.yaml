# ================================================================
# Cloud Build — Campaign Intelligence API
# Trigger: cambios en dashboards/campaign-intelligence/** o clients/**
# ================================================================
steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'copy-clients-into-api'
    entrypoint: bash
    args:
      - '-c'
      - 'cp -r clients dashboards/campaign-intelligence/api/clients'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-campaign-intelligence-api'
    waitFor: ['copy-clients-into-api']
    entrypoint: gcloud
    args:
      - functions
      - deploy
      - campaign-intelligence-api
      - --gen2
      - --runtime=python311
      - --region=europe-west1
      - --source=dashboards/campaign-intelligence/api
      - --entry-point=dashboard_api
      - --trigger-http
      - --no-allow-unauthenticated
      - --memory=512MB
      - --timeout=120s
      - --service-account=dashboards-sa@llyc-ai-first-core.iam.gserviceaccount.com
      - --set-env-vars=DEFAULT_TENANT_ID=lcdc
includedFiles:
  - 'dashboards/campaign-intelligence/**'
  - 'clients/**'
options:
  logging: CLOUD_LOGGING_ONLY